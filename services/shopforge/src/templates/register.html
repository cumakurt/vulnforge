{% extends "base.html" %}
{% block title %}Create Account — ShopForge{% endblock %}

{% block content %}
<div class="container" style="max-width:460px;padding-top:48px;padding-bottom:48px">
  <div class="card" style="padding:32px">
    <h1 style="font-size:22px;font-weight:700;margin-bottom:4px">Create Account</h1>
    <p class="text-muted text-sm mb-6">Already have an account? <a href="/login">Sign in →</a></p>

    <!-- AUTH: register also goes through PHP which uses MD5 (CRYPTO-001) -->
    <form action="/php/auth/register.php" method="POST">
      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" placeholder="Choose a username" required>
      </div>
      <div class="form-group">
        <label>Email</label>
        <!-- PY-011: email validation triggers ReDoS -->
        <input type="email" name="email" placeholder="you@example.com" required
               onblur="validateEmail(this.value)">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" placeholder="At least 8 characters" required>
        <div class="form-hint">Password stored as MD5 hash. See <a href="/php/crypto/hash.php">/php/crypto/hash.php</a></div>
      </div>
      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" name="password_confirm" placeholder="Repeat password" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%">Create Account</button>
    </form>

    <!-- OAuth registration links -->
    <div style="border-top:1px solid var(--border);margin:20px 0;text-align:center">
      <span class="text-sm text-muted">or sign up with</span>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px">
      <a href="/auth/authorize?response_type=code&client_id=shopforge&redirect_uri=https://evil.example/cb&scope=read write admin"
         class="btn btn-outline" style="justify-content:center">🔐 OAuth Sign Up</a>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
// PY-011: ReDoS — catastrophic backtracking on email validation
async function validateEmail(email) {
  if (!email) return;
  // Sends to vulnerable regex endpoint
  const r = await fetch('/py/validate?email=' + encodeURIComponent(email));
  const d = await r.json();
  console.log('Email valid:', d.valid);
}
</script>
{% endblock %}
