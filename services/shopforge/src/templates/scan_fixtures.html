<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Passive scanner fixtures · ShopForge</title>
</head>
<body>
  <main>
    <h1>Passive scanner fixtures</h1>
    <p>Each case has two fixed responses for comparing scanner findings.</p>
    <ul>
      {% for case, label in fixtures.items() %}
      <li>
        {{ label }}
        <a href="/scan-fixtures/{{ case }}/sample-a">Sample A</a>
        <a href="/scan-fixtures/{{ case }}/sample-b">Sample B</a>
      </li>
      {% endfor %}
    </ul>
  </main>
</body>
</html>
