{% extends "base.html" %}
{% block title %}Admin Login — ShopForge{% endblock %}
{% block content %}
<div class="container" style="max-width:400px;padding-top:60px;padding-bottom:48px">
  <div class="card" style="padding:32px">
    <div style="text-align:center;margin-bottom:20px">
      <div style="font-size:40px">🔐</div>
      <h1 style="font-size:20px;font-weight:700;margin-top:8px">Admin Login</h1>
    </div>

    <!-- AUTH-001: SQLi bypass — admin'-- -->
    <!-- AUTH-003: username enumeration -->
    <form action="/php/auth/login.php" method="POST">
      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" placeholder="admin" value="admin">
        <div class="form-hint">Try: <code>admin'--</code> (SQLi bypass)</div>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" placeholder="admin123">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%">Sign In</button>
    </form>

    <div style="border-top:1px solid var(--border);margin:20px 0"></div>

    <!-- LEG-005: legacy default credentials admin/admin -->
    <div class="text-sm text-muted" style="margin-bottom:12px">Legacy admin (admin / admin):</div>
    <form action="/legacy/admin/login.php" method="POST">
      <div style="display:flex;gap:8px">
        <input type="hidden" name="username" value="admin">
        <input type="hidden" name="password" value="admin">
        <button type="submit" class="btn btn-outline btn-sm" style="width:100%">Legacy Login →</button>
      </div>
    </form>

    <div style="margin-top:16px;text-align:center">
      <a href="/api/v1/auth/impersonate?username=admin" class="text-sm">Get admin token (no auth required)</a>
    </div>
  </div>
</div>
{% endblock %}
