# VulnForge Lab — Docker Compose
#
# Architecture: 9 application containers (down from 19).
# All 78+ vulnerabilities preserved.
#
# Merged services:
#   crawl-lab   → node-api  (/spa/* routes)
#   graphql-svc → node-api  (/graphql routes)
#   auth-svc    → flask-svc (/auth/* routes)
#   legacy-svc  → flask-svc (/legacy/* routes)
#   internal-metadata → lab-control (/latest/meta-data/* routes)
#
# Dropped containers (confirmed zero vuln dependency):
#   postgres  — flask-svc/spring-svc env var set but code never connects
#   mongodb   — node-api/graphql-svc use in-memory simulators
#   redis     — go-svc env var set but code uses in-memory Go structs
#   mailhog   — no vuln tests SMTP directly
#
# Running containers:
#   1. gateway          Nginx reverse proxy + WAF profiles
#   2. lab-control      Control plane + IMDSv1 metadata simulator
#   3. oob-collector    OOB HTTP + DNS callback listener
#   4. shopforge        Unified scanner portal (synthetic e-commerce site)
#   5. php-web          PHP/Apache — 26 vulns (SQLi, XSS, CSRF, LFI, …)
#   6. mysql            Required by php-web (raw mysqli, session fixation)
#   7. node-api         Node.js — 28 vulns (API, GQL, CRAWL merged)
#   8. flask-svc        Python  — 25 vulns (PY, OAUTH, LEG merged)
#   9. spring-svc       Java    — 10 vulns (XXE, deserialization, JNDI, …)
#  10. go-svc           Go      — 10 vulns (race condition, goroutine, …)
#
# Usage:
#   ./docker_install.sh           # starts all services
#   docker compose up -d          # same (COMPOSE_PROFILES=full in .env)
#   make up                       # alias
#
# All ports are bound to 127.0.0.1 only.

x-no-new-privileges: &no-new-privileges
  security_opt:
    - no-new-privileges:true

x-hc: &hc
  interval: 15s
  timeout: 5s
  start_period: 30s
  retries: 5

services:

  # ── Gateway ───────────────────────────────────────────────────────────────
  gateway:
    build: ./gateway
    image: vulnforge/gateway:latest
    container_name: vulnforge-gateway
    profiles: [core, full, api, waf]
    ports:
      - "${BIND_HOST:-127.0.0.1}:${GATEWAY_HTTP_PORT:-8000}:8000"
      - "${BIND_HOST:-127.0.0.1}:${GATEWAY_HTTPS_PORT:-8443}:8443"
    networks:
      - lab_net
    <<: *no-new-privileges
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 128M }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/"]
      <<: *hc
    restart: unless-stopped

  # ── Lab Control + IMDSv1 metadata simulator ───────────────────────────────
  # Also serves /latest/meta-data/* (absorbed from internal-metadata)
  # Fixed IP 169.254.169.100 on internal_net for realistic SSRF payloads.
  # Hostname alias "internal-metadata" so existing SSRF payloads still work.
  lab-control:
    build: ./lab/lab-control
    image: vulnforge/lab-control:latest
    container_name: vulnforge-lab-control
    profiles: [core, full, api, waf]
    ports:
      - "${BIND_HOST:-127.0.0.1}:${LAB_CONTROL_PORT:-9100}:9100"
    networks:
      lab_net: {}
      internal_net:
        ipv4_address: 169.254.169.100
        aliases:
          - internal-metadata
    volumes:
      - ./lab/truth:/app/lab/truth:ro
    environment:
      - TRUTH_DIR=/app/lab/truth
      - WAF_PROFILE=${WAF_PROFILE:-waf-off}
      - SEED_PROFILE=${SEED_PROFILE:-small}
    <<: *no-new-privileges
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 128M }
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9100/__lab/mode')"]
      <<: *hc
    restart: unless-stopped

  # ── OOB Collector ─────────────────────────────────────────────────────────
  oob-collector:
    build: ./infra/oob-collector
    image: vulnforge/oob-collector:latest
    container_name: vulnforge-oob-collector
    profiles: [core, full, api, waf]
    ports:
      - "${BIND_HOST:-127.0.0.1}:${OOB_COLLECTOR_HTTP_PORT:-9000}:9000"
      - "${BIND_HOST:-127.0.0.1}:${OOB_COLLECTOR_DNS_PORT:-5353}:5353/udp"
    networks:
      - lab_net
    <<: *no-new-privileges
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 128M }
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health')"]
      <<: *hc
    restart: unless-stopped

  # ── ShopForge Portal ──────────────────────────────────────────────────────
  # Unified scanner target: realistic e-commerce site, all vulns discoverable
  # from a single URL through natural navigation + crawling.
  shopforge:
    build: ./services/shopforge
    image: vulnforge/shopforge:latest
    container_name: vulnforge-shopforge
    profiles: [core, full, api, waf]
    networks:
      - lab_net
    environment:
      - PORT=3100
    <<: *no-new-privileges
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 128M }
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3100/health')"]
      <<: *hc
    restart: unless-stopped

  # ── PHP Web ───────────────────────────────────────────────────────────────
  # 26 vulns: AUTH-001..004, CMDI-001..002, CONF-001..002, CRYPTO-001,
  #   CSRF-001, IDOR-001..002, INFO-001, LFI-001, REDIR-001,
  #   SQLI-001..007, UPLOAD-001, XSS-001..003
  php-web:
    build: ./services/php-web
    image: vulnforge/php-web:latest
    container_name: vulnforge-php-web
    profiles: [core, full, waf]
    networks:
      - lab_net
      - data_net
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_DATABASE=${MYSQL_DATABASE:-vulnforge}
      - MYSQL_USER=${MYSQL_USER:-vulnlab}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-vulnlab_pass}
      - SEED_PROFILE=${SEED_PROFILE:-small}
      - LAB_CONTROL_URL=http://lab-control:9100
    depends_on:
      mysql:
        condition: service_healthy
      lab-control:
        condition: service_healthy
    <<: *no-new-privileges
    deploy:
      resources:
        limits: { cpus: "0.75", memory: 256M }
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1/health.php"]
      <<: *hc
    restart: unless-stopped

  # ── MySQL ─────────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: vulnforge-mysql
    profiles: [core, full, waf]
    networks:
      - data_net
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-vulnforge_root}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-vulnforge}
      - MYSQL_USER=${MYSQL_USER:-vulnlab}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-vulnlab_pass}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./services/php-web/db/seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    <<: *no-new-privileges
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 256M }
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-vulnforge_root}"]
      <<: *hc
    restart: unless-stopped

  # ── Node API ──────────────────────────────────────────────────────────────
  # 28 vulns: API-001..014 + GQL-001..006 + CRAWL-001..008
  #   (graphql-svc and crawl-lab merged in)
  node-api:
    build: ./services/node-api
    image: vulnforge/node-api:latest
    container_name: vulnforge-node-api
    profiles: [core, full, api]
    networks:
      - lab_net
      - internal_net
    environment:
      - JWT_WEAK_SECRET=${JWT_WEAK_SECRET:-secret}
      - SEED_PROFILE=${SEED_PROFILE:-small}
      - LAB_CONTROL_URL=http://lab-control:9100
      - OOB_COLLECTOR_URL=http://oob-collector:9000
      - PORT=3000
    depends_on:
      lab-control:
        condition: service_healthy
    <<: *no-new-privileges
    deploy:
      resources:
        limits: { cpus: "0.75", memory: 256M }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      <<: *hc
    restart: unless-stopped

  # ── Flask Service ─────────────────────────────────────────────────────────
  # 25 vulns: PY-001..011 + OAUTH-001..007 + LEG-001..007
  #   (auth-svc and legacy-svc merged in)
  flask-svc:
    build: ./services/flask-svc
    image: vulnforge/flask-svc:latest
    container_name: vulnforge-flask-svc
    profiles: [core, full, api]
    networks:
      - lab_net
      - internal_net
    environment:
      - LAB_CONTROL_URL=http://lab-control:9100
      - OOB_COLLECTOR_URL=http://oob-collector:9000
    depends_on:
      lab-control:
        condition: service_healthy
    <<: *no-new-privileges
    deploy:
      resources:
        limits: { cpus: "0.75", memory: 256M }
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      <<: *hc
    restart: unless-stopped

  # ── Spring Service ────────────────────────────────────────────────────────
  # 10 vulns: JAVA-001..010 (JVM-exclusive: XMLDecoder, SAX XXE, DES/ECB,
  #   javax.crypto, JNDI lookup pattern — cannot be replicated in Python/Node)
  spring-svc:
    build: ./services/spring-svc
    image: vulnforge/spring-svc:latest
    container_name: vulnforge-spring-svc
    profiles: [core, full]
    networks:
      - lab_net
      - internal_net
    environment:
      - LAB_CONTROL_URL=http://lab-control:9100
      - OOB_COLLECTOR_URL=http://oob-collector:9000
    <<: *no-new-privileges
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      <<: *hc
    restart: unless-stopped

  # ── Go Service ────────────────────────────────────────────────────────────
  # 10 vulns: GO-001..011 (goroutine race GO-003, debug.Stack() GO-010
  #   require Go runtime — cannot be replicated in Python/Node)
  go-svc:
    build: ./services/go-svc
    image: vulnforge/go-svc:latest
    container_name: vulnforge-go-svc
    profiles: [core, full]
    networks:
      - lab_net
      - internal_net
    environment:
      - LAB_CONTROL_URL=http://lab-control:9100
      - OOB_COLLECTOR_URL=http://oob-collector:9000
      - PORT=8090
    depends_on:
      lab-control:
        condition: service_healthy
    <<: *no-new-privileges
    deploy:
      resources:
        limits: { cpus: "0.75", memory: 256M }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/health"]
      <<: *hc
    restart: unless-stopped

# ────────────────────────────────────────────────────────────────────────────
# NETWORKS
# ────────────────────────────────────────────────────────────────────────────
networks:
  lab_net:
    driver: bridge
    name: vulnforge_lab_net

  data_net:
    driver: bridge
    internal: true
    name: vulnforge_data_net

  internal_net:
    driver: bridge
    internal: true
    name: vulnforge_internal_net
    ipam:
      config:
        - subnet: 169.254.169.0/24

# ────────────────────────────────────────────────────────────────────────────
# VOLUMES
# ────────────────────────────────────────────────────────────────────────────
volumes:
  mysql_data:
    name: vulnforge_mysql_data
