# VulnForge Lab — Nginx Gateway
# Single entry point for all lab services.
# Binds to 127.0.0.1 only.
#
# Upstreams are resolved through Docker's embedded DNS at request time via
# variables. This keeps the gateway functional in small profiles where only a
# subset of services is running (unresolved services return 502 instead of
# preventing Nginx from starting).

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    resolver 127.0.0.11 ipv6=off valid=10s;

    # Structured access log (request logger picks this up)
    log_format json_combined escape=json
        '{'
            '"ts":"$time_iso8601",'
            '"method":"$request_method",'
            '"uri":"$request_uri",'
            '"status":$status,'
            '"body_bytes":$body_bytes_sent,'
            '"request_time":$request_time,'
            '"remote_addr":"$remote_addr",'
            '"http_host":"$http_host",'
            '"http_user_agent":"$http_user_agent",'
            '"http_referer":"$http_referer",'
            '"upstream":"$upstream_addr",'
            '"request_id":"$request_id"'
        '}';

    access_log /var/log/nginx/access.log json_combined;

    sendfile        on;
    keepalive_timeout 65;

    # Add a unique request ID to every request
    add_header X-Request-Id $request_id always;

    # ── WAF profile include (selected via symlink or env) ─────────────────
    include /etc/nginx/profiles/active.conf;

    # ── HTTP server ────────────────────────────────────────────────────────
    server {
        listen 8000;
        server_name _;

        set $php_backend       "php-web:80";
        set $node_backend      "node-api:3000";
        set $flask_backend     "flask-svc:5000";
        set $spring_backend    "spring-svc:8080";
        set $go_backend        "go-svc:8090";
        set $graphql_backend   "graphql-svc:4000";
        set $crawl_backend     "crawl-lab:3001";
        set $legacy_backend    "legacy-svc:8888";
        set $auth_backend      "auth-svc:8080";
        set $shopforge_backend "shopforge:3100";

        # Pass real request ID to upstream
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ── ShopForge Portal (unified scanner target) ─────────────────────
        location / {
            proxy_pass http://$shopforge_backend;
        }

        # ── PHP Web ───────────────────────────────────────────────────────
        location /php/ {
            rewrite ^/php/(.*)$ /$1 break;
            proxy_pass http://$php_backend;
        }

        # ── Node API ──────────────────────────────────────────────────────
        location /api/ {
            proxy_pass http://$node_backend;
        }

        # ── Flask Service ─────────────────────────────────────────────────
        location /py/ {
            proxy_pass http://$flask_backend;
        }

        # ── Spring Service ────────────────────────────────────────────────
        location /java/ {
            proxy_pass http://$spring_backend;
        }

        # ── Go Service ────────────────────────────────────────────────────
        location /go/ {
            proxy_pass http://$go_backend;
        }

        # ── GraphQL Service ───────────────────────────────────────────────
        location /graphql {
            rewrite ^/graphql(.*)$ /graphql$1 break;
            proxy_pass http://$graphql_backend;
        }

        # Hardened GraphQL twin used for control measurements.
        location /graphql_safe {
            proxy_pass http://$graphql_backend;
        }

        # ── Crawl Lab (SPA) ───────────────────────────────────────────────
        location /spa/ {
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_pass http://$crawl_backend;
        }

        # ── Legacy Service ────────────────────────────────────────────────
        location /legacy/ {
            rewrite ^/legacy/(.*)$ /$1 break;
            proxy_pass http://$legacy_backend;
        }

        # ── Auth Service ──────────────────────────────────────────────────
        location /auth/ {
            rewrite ^/auth/(.*)$ /$1 break;
            proxy_pass http://$auth_backend;
        }

        # ── Root / status (JSON) ──────────────────────────────────────────
        location = /__status {
            return 200 '{"service":"VulnForge Lab Gateway","status":"ok","portal":"/","author":"Cuma KURT"}';
            add_header Content-Type application/json;
        }
    }

    # ── HTTPS server — TLS profile included dynamically ───────────────────
    include /etc/nginx/tls/active-tls.conf;
}
