# TLS server block — included by nginx.conf
# Default: self-signed certificate
server {
    listen 8443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/tls/selfsigned/cert.pem;
    ssl_certificate_key /etc/nginx/tls/selfsigned/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Same proxy rules as HTTP server
    include /etc/nginx/conf.d/proxy-locations.conf;
}
